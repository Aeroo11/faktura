# Prometheus for the local stack (docker compose --profile obs). See docs/observability.md.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API runs on the host, metrics on FAKTURA_METRICS_PORT (9077).
  - job_name: faktura-api
    static_configs:
      - targets: ["host.docker.internal:9077"]
