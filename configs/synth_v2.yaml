# Synthetic AP dataset v2: harder on purpose. v1 scored 100% on 10 invoices, which says
# the data was too easy, not that the model is perfect. v2 varies one difficulty factor
# at a time (layout, number/date format, degradation level) so the eval can show which
# factor breaks extraction.
seed: 2026
n_vendors: 15
n_purchase_orders: 320
start_date: 2025-01-01
end_date: 2025-12-31
vat_bps: 1100
max_lines_per_po: 6
partial_delivery_rate: 0.2
anomaly_rate: 0.3
anomaly_weights:
  price_mismatch: 1.0
  qty_over_received: 1.0
  duplicate_invoice: 1.0
  npwp_mismatch: 0.7
  vat_miscalc: 0.7
  bank_account_changed: 0.6
long_description_rate: 0.3
render:
  layout_weights: {classic: 1, modern: 1, compact: 1, borderless: 1}
  date_styles: [short, long, iso, mon]
  money_styles: [id_rp, id_rp_dec, idr_comma]
  # Equal share per level, so each level has enough invoices to compare.
  level_weights: {0: 1, 1: 1, 2: 1, 3: 1}
  stamp_rate: 0.4
