# Local Postgres for Faktura. Port 5433 so it does not clash with a local Postgres.
# Credentials are for local development only.
services:
  db:
    image: postgres:17.6-alpine
    container_name: faktura-db
    environment:
      POSTGRES_USER: faktura
      POSTGRES_PASSWORD: faktura-dev
      POSTGRES_DB: faktura
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - faktura-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktura -d faktura"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

volumes:
  faktura-pg:
