# Local services for Faktura. Credentials are for local development only.
#
#   docker compose up -d db                 # Faktura's own Postgres
#   docker compose --profile erp up -d      # plus Odoo 20 as the ERP (see docs/erp.md)
#   docker compose --profile sso up -d      # plus Keycloak for sign-in (see docs/auth.md)
#   docker compose --profile obs up -d      # Prometheus, Grafana, Jaeger (docs/observability.md)
services:
  db:
    image: postgres:17.6-alpine
    container_name: faktura-db
    environment:
      POSTGRES_USER: faktura
      POSTGRES_PASSWORD: faktura-dev
      POSTGRES_DB: faktura
    ports:
      # Port 5433 so it does not clash with a local Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - faktura-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faktura -d faktura"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  # Odoo keeps its data in its own Postgres: an ERP owns its database, and Faktura
  # only talks to it through the ERP's API.
  odoo-db:
    image: postgres:17.6-alpine
    container_name: faktura-odoo-db
    profiles: [erp]
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo-dev
      POSTGRES_DB: postgres
    volumes:
      - odoo-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  odoo:
    image: odoo:20.0
    container_name: faktura-odoo
    profiles: [erp]
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: odoo-dev
    command: ["-d", "faktura_erp", "--db-filter=^faktura_erp$$"]
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
    mem_limit: 1536m

  # Single sign-on for the review queue. Dev mode: HTTP, embedded database, the realm
  # (roles, demo users, the faktura-web client) imported from keycloak/ on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: faktura-keycloak
    profiles: [sso]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-dev
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/faktura-realm.json:/opt/keycloak/data/import/faktura-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    mem_limit: 1g

  # Observability (docs/observability.md): Prometheus scrapes the API's metrics port on
  # the host, Grafana shows the dashboard, Jaeger receives traces over OTLP.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: faktura-prometheus
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.1
    container_name: faktura-grafana
    profiles: [obs]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin-dev
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # read-only viewer, local only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/faktura.json
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 512m

  jaeger:
    image: jaegertracing/jaeger:2.9.0
    container_name: faktura-jaeger
    profiles: [obs]
    ports:
      - "127.0.0.1:16686:16686"  # UI
      - "127.0.0.1:4318:4318"  # OTLP over HTTP
    mem_limit: 512m

volumes:
  prometheus-data:
  keycloak-data:
  faktura-pg:
  odoo-pg:
  odoo-data:
